<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="./css/main.css">
	<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="main">
		<div class="header">
			<h1>
				Electronic spectra of conjugated dye and test of free electron model
			</h1>
		</div>
		<div class="footer">
			<div class="simulate" id="simulator" style=" background: linear-gradient(45deg, #f0d5ac , #f8ca8e);">
				<!-- <img id="lab" src="./images/screen.png" alt="images">
				<marquee>If the max absorbance value is greater than 1, dillute the sample and repeat the experiment .(Otherwise error will be incorporeted).</marquee> -->
			</div>
			<div id="work">
						<div class="result-section">
						
 		   <h2>Wavelength Maximum Data</h2>

 		   <table class="data-table">
 		       <tr>
 		           <th>Dye Name</th>
 		           <th>Wavelength Maximum</th>
 		       </tr>
 		       <tr>
 		           <td>1,4-diphenyl-1,3-butadiene</td>
 		           <td>329.5 nm</td>
 		       </tr>
 		       <tr>
 		           <td>1,6-diphenyl-1,3,5-hexatriene</td>
 		           <td>353.5 nm</td>
 		       </tr>
 		       <tr>
 		           <td>1,8-diphenyl-1,3,5,7-octatetraene</td>
 		           <td>374.0 nm</td>
 		       </tr>
 		   </table>

 		   <div class="card2">
 		       <canvas id="spectraChart"></canvas>
		    </div>

		</div>

			</div>
			<div id="message">
				<h1 id="ins">Instructions</h1>
				<h1 id="text" class="step1">
					Click End button to stop the Experiment
				</h1>
                <button id="start" onclick="alert('Experiment completed....\nExit the simulation....')">End</a></button>
			</div>
		</div>
		
	</div>

	<script>const wavelengths = [250,260,270,280,290,300,310,320,329.5,330,340,353.5,360,374.0,380,390,400,410,420];

const dye1 = [0.05,0.06,0.08,0.12,0.18,0.28,0.38,0.45,0.55,0.45,0.42,0.25,0.10,0.03,0,0,0,0,0];
const dye2 = [0.03,0.04,0.06,0.08,0.12,0.18,0.20,0.25,0.27,0.4,0.42,0.50,0.32,0.05,0.02,0,0,0];
const dye3 = [0.02,0.03,0.04,0.05,0.07,0.12,0.18,0.26,0.35,0.44,0.48,0.55,0.60,0.68,0.45,0.50,0.10,0.02];

const ctx = document.getElementById('spectraChart').getContext('2d');

new Chart(ctx, {
    type: 'line',
    data: {
        labels: wavelengths,
        datasets: [
            {
                label: '1,4-diphenyl-1,3-butadiene (329.5 nm)',
                data: dye1,
                borderColor: 'blue',
                fill: false,
                tension: 0.4
            },
            {
                label: '1,6-diphenyl-1,3,5-hexatriene (353.5 nm)',
                data: dye2,
                borderColor: 'green',
                fill: false,
                tension: 0.4
            },
            {
                label: '1,8-diphenyl-1,3,5,7-octatetraene (374 nm)',
                data: dye3,
                borderColor: 'orange',
                fill: false,
                tension: 0.4
            }
        ]
    },
    options: {
        responsive: true,
        plugins: {
            legend: {
                position: 'top'
            }
        },
        scales: {
            x: {
                title: {
                    display: true,
                    text: 'Wavelength (nm)'
                }
            },
            y: {
                title: {
                    display: true,
                    text: 'Absorbance'
                },
                min: 0,
                max: 0.7
            }
        }
    }
});
</script>
    <script src="js/main.js"></script>

</body>
</html>
